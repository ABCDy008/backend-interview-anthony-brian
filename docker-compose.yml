services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fx_api
      POSTGRES_USER: fx_api
      POSTGRES_PASSWORD: fx_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fx_api -d fx_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://fx_api:fx_api@db:5432/fx_api
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
